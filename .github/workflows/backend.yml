name: backend

# Checks run locally with `make check` before every commit and PR; this
# workflow runs only when started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# Every job runs a make target, so this workflow and `make check` do the
# same thing with the same pinned tool versions.
jobs:
  generate:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Regenerates the sqlc and OpenAPI code and fails if it differs from
      # what is committed.
      - run: make generate-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Integration tests start Postgres through testcontainers, using the
      # runner's Docker.
      - run: make test
