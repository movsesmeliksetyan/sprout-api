# Values that mark a row as money out or in, in a column of its own beside
# an unsigned amount (ING's "Af Bij", a bank's "DEBIT"/"CREDIT"). A column
# whose values are all markers is read as the direction, not as text.
direction_markers:
  debit: [af, debit, dr, d, s, soll, out, withdrawal, cargo, charge, debet, расход, списание, ելք, "-"]
  credit: [bij, credit, cr, c, h, haben, in, deposit, abono, kredit, приход, зачисление, մուտք, "+"]
