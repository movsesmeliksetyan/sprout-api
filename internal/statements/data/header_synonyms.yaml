# Column labels that say what a statement column holds (PRD §4.3 stage 3b),
# by role. Labels are compared lower case, without accents, with
# punctuation as spaces; a label matches when it equals an entry, and
# partly when it contains one as whole words. Languages: English, German,
# Spanish, French, Italian, Dutch, Portuguese, Polish, Russian, Armenian.
# "ignore" holds labels that look like a role but are not the one to read
# (a value date next to the booking date, a time).

