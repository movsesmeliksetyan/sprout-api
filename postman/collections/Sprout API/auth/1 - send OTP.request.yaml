$kind: http-request
name: '1 - Send OTP'
method: POST
url: 'https://{{auth0Domain}}/passwordless/start'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "client_id": "{{auth0ClientId}}",
      "connection": "email",
      "email": "{{authEmail}}",
      "send": "code"
    }
