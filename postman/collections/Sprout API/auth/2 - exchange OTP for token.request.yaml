$kind: http-request
name: '2 - Exchange OTP for token'
method: POST
url: 'https://{{auth0Domain}}/oauth/token'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "grant_type": "http://auth0.com/oauth/grant-type/passwordless/otp",
      "client_id": "{{auth0ClientId}}",
      "username": "{{authEmail}}",
      "otp": "{{authOtp}}",
      "realm": "email",
      "audience": "{{auth0Audience}}",
      "scope": "openid profile email"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.access_token) {
          pm.collectionVariables.set("bearerToken", json.access_token);
          console.log("✅ bearerToken saved to collection variables");
      } else {
          console.error("❌ Token exchange failed:", JSON.stringify(json));
      }
