$kind: http-request
name: 'Archive category'
method: PATCH
url: '{{baseUrl}}/v1/categories/{{categoryId}}'
order: 4100
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: categoryId
    value: '{{categoryId}}'
body:
  type: json
  content: |-
    {
      "archived": true
    }
