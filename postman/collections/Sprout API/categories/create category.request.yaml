$kind: http-request
name: 'Create category'
method: POST
url: '{{baseUrl}}/v1/categories'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Groceries",
      "icon": "cart",
      "shade": 2,
      "monthly_budget_minor": 50000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.collectionVariables.set("categoryId", json.id);
          console.log("✅ categoryId saved: " + json.id);
      } else {
          console.error("❌ Category was not created:", JSON.stringify(json));
      }
