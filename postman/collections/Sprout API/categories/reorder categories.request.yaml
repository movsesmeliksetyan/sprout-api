$kind: http-request
name: 'Reorder categories'
method: PUT
url: '{{baseUrl}}/v1/categories/order'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ids": {{categoryIds}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.items) {
          const ids = json.items.map((c) => c.id);
          pm.collectionVariables.set("categoryIds", JSON.stringify(ids.slice(1).concat(ids.slice(0, 1))));
          console.log("✅ New order: " + json.items.map((c) => c.name).join(", "));
      } else {
          console.error("❌ Reorder failed; run \"List categories\" to refresh categoryIds:", JSON.stringify(json));
      }
