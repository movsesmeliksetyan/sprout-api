$kind: http-request
name: 'Restore category'
method: PATCH
url: '{{baseUrl}}/v1/categories/{{categoryId}}'
order: 4200
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: categoryId
    value: '{{categoryId}}'
body:
  type: json
  content: |-
    {
      "archived": false
    }
