$kind: http-request
name: 'List goals'
method: GET
url: '{{baseUrl}}/v1/goals'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.items.length > 0 && !pm.collectionVariables.get("goalId")) {
          pm.collectionVariables.set("goalId", json.items[0].id);
          console.log("✅ goalId saved: " + json.items[0].id);
      }
