$kind: http-request
name: 'Set goal image'
method: PATCH
url: '{{baseUrl}}/v1/goals/{{goalId}}'
order: 4050
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: goalId
    value: '{{goalId}}'
body:
  type: json
  content: |-
    {
      "image_upload_id": "{{uploadId}}"
    }
