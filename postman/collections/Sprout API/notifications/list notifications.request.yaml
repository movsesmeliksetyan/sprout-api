$kind: http-request
name: 'List notifications'
method: GET
url: '{{baseUrl}}/v1/notifications'
order: 3000
queryParams:
  - key: limit
    value: '50'
    description: 'Page size (1-200)'
    disabled: true
  - key: cursor
    value: ''
    description: 'next_cursor from previous page'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json.items.length > 0) {
          pm.collectionVariables.set("notificationId", json.items[0].id);
          console.log("✅ notificationId saved: " + json.items[0].id);
      }
