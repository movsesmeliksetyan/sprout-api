$kind: http-request
name: 'Create transaction'
method: POST
url: '{{baseUrl}}/v1/transactions'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Idempotency-Key
    value: '{{$guid}}'
body:
  type: json
  content: |-
    {
      "kind": "expense",
      "amount_minor": 1250,
      "category_id": "{{categoryId}}",
      "merchant": "Blue Bottle Coffee",
      "note": "Morning coffee",
      "occurred_at": "2025-01-15T09:30:00Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.collectionVariables.set("transactionId", json.id);
          console.log("✅ transactionId saved: " + json.id);
      }
