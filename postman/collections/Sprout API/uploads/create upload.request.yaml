$kind: http-request
name: '1 - Request presigned upload'
method: POST
url: '{{baseUrl}}/v1/uploads'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "purpose": "avatar",
      "content_type": "image/jpeg",
      "size_bytes": 204800,
      "filename": "avatar.jpg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 201 && json.id) {
          pm.collectionVariables.set("uploadId", json.id);
          pm.collectionVariables.set("uploadUrl", json.upload_url);
          pm.collectionVariables.set("uploadContentType", json.headers["Content-Type"]);
          console.log("✅ uploadId, uploadUrl and uploadContentType saved; the URL works until " + json.expires_at);
      } else {
          console.error("❌ Upload request failed:", JSON.stringify(json));
      }
