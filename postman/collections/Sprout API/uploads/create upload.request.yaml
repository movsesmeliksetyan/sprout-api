$kind: http-request
name: 'Request presigned upload'
method: POST
url: '{{baseUrl}}/v1/uploads'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "purpose": "receipt",
      "content_type": "image/jpeg",
      "size_bytes": 204800,
      "filename": "receipt.jpg"
    }
